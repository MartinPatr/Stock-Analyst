[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockchecker"
version = "1.0.0"
description = "Aggregate analyst consensus from multiple sources into one normalized 0-5 rating, rank a ticker universe, and query it from a CLI or Discord."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "yfinance>=0.2.50",
    "typer>=0.12",
    "rich>=13.7",
    "discord.py>=2.3",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
stockchecker = "stockchecker.cli:app"

[tool.setuptools]
packages = ["stockchecker", "stockchecker.sources", "stockchecker.bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]
# SourceBlocked / TickerNotFound read better than *Error suffixes for these domain exceptions.
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network; skipped unless --live is passed"]
addopts = "-q"
